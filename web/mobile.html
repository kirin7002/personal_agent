<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#f8f6f2">
  <meta name="description" content="和小伴聊聊，轻松处理车辆需求与日常计划。">
  <title>小伴 · 我的助理</title>
  <link rel="stylesheet" href="/static/mobile.css">
  <script type="module" src="/static/mobile.js"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8m-4-5v5"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6Z"/></symbol>
  </defs></svg>
  <main class="app-shell" id="app">
    <header class="topbar">
      <button class="identity" id="openActivity" aria-label="查看小伴的活动">
        <span class="orb orb-small" aria-hidden="true"><span class="orb-eyes"></span></span>
        <span><strong>小伴</strong><span class="live-status" id="connectionStatus">正在连接…</span></span>
      </button>
      <div class="header-right"><span class="demo-label">模拟车辆</span><button class="icon-button" id="openMenu" aria-label="打开活动与计划"><svg><use href="#i-menu"/></svg></button></div>
    </header>
    <div class="connection-banner" id="offlineBanner" hidden><span>连接中断，消息和草稿都还在。</span><button id="reconnect">重新连接</button></div>
    <section class="conversation" id="conversation" aria-label="与小伴的对话">
      <button class="history-button" id="loadEarlier" hidden>查看更早的对话</button>
      <div class="welcome" id="welcome">
        <div class="orb orb-hero" aria-hidden="true"><span class="orb-eyes"></span><span class="orb-glint"></span></div>
        <p class="eyebrow">一点小事，随时找我</p>
        <h1>今天，想做些什么？</h1>
        <p class="welcome-note">调好车里的温度，或安排一次日常检查。<br>说出来，我们一起完成。</p>
        <div class="suggestions" aria-label="试试这样说">
          <button data-suggestion="把空调调到23度"><span class="suggestion-mark">✳</span><span>车里舒服一点<small>把空调调到 23 度</small></span><svg><use href="#i-arrow"/></svg></button>
          <button data-suggestion="每天早上8点查车辆电量"><span class="suggestion-mark peach">◷</span><span>把日常记下来<small>每天早上 8 点查电量</small></span><svg><use href="#i-arrow"/></svg></button>
        </div>
      </div>
      <div id="messages" class="messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="聊天记录"></div>
    </section>
    <footer class="composer-area">
      <div class="voice-strip" id="voiceStrip" hidden><span class="voice-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="voiceStatus">正在连接语音…</span><button id="stopVoice">结束</button></div>
      <div class="reply-context" id="replyContext" hidden><span id="replyLabel"></span><button id="clearReply" aria-label="取消指定任务">×</button></div>
      <div class="inline-error" id="sendError" role="alert" hidden></div>
      <form class="composer" id="messageForm">
        <label class="sr-only" for="messageInput">发消息给小伴</label>
        <textarea id="messageInput" rows="1" placeholder="说说你想做的事…" maxlength="2000" enterkeyhint="send"></textarea>
        <button type="button" class="icon-button voice-button" id="voiceButton" aria-label="开始语音对话" aria-pressed="false"><svg><use href="#i-mic"/></svg></button>
        <button class="send-button" id="sendButton" aria-label="发送消息" disabled><svg><use href="#i-send"/></svg></button>
      </form>
      <button class="pair-hint" id="pairHint"><span class="tiny-dot"></span><span id="pairHintText">连接电脑，让对话接着聊</span><svg><use href="#i-arrow"/></svg></button>
    </footer>
  </main>
  <dialog id="activityDialog" class="sheet" aria-labelledby="activityTitle">
    <div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><div><p class="eyebrow">和小伴一起</p><h2 id="activityTitle">每件小事，都有着落</h2></div><button class="icon-button" data-close="activityDialog" aria-label="关闭活动与计划"><svg><use href="#i-close"/></svg></button></header>
    <div class="tabs" role="tablist" aria-label="活动分类"><button id="tab-activity" role="tab" aria-selected="true" aria-controls="panel-activity" data-tab="activity">活动</button><button id="tab-plans" role="tab" aria-selected="false" aria-controls="panel-plans" data-tab="plans" tabindex="-1">计划</button><button id="tab-devices" role="tab" aria-selected="false" aria-controls="panel-devices" data-tab="devices" tabindex="-1">连接</button></div>
    <div class="sheet-body"><p id="drawerError" class="inline-error" role="alert" hidden></p><section id="panel-activity" role="tabpanel" aria-labelledby="tab-activity"><div id="activityList"></div></section><section id="panel-plans" role="tabpanel" aria-labelledby="tab-plans" hidden><p class="section-note">安排好，下次就不用惦记。</p><button class="new-plan" id="newPlan">＋ 用一句话安排计划</button><div id="plansList"></div></section><section id="panel-devices" role="tabpanel" aria-labelledby="tab-devices" hidden><div class="connection-card"><svg><use href="#i-device"/></svg><h3>一段对话，随身带着</h3><p>连接电脑后，在这里聊天，<br>在电脑查看处理过程。</p><button class="primary-button" id="openPairing">输入电脑配对码</button><button class="text-button" id="resetDevice" hidden>重新连接此设备</button></div><div id="devicesList"></div><a class="desktop-link" href="/">在当前设备打开电脑观察台 ↗</a></section></div>
  </dialog>
  <dialog id="pairDialog" class="sheet compact-sheet" aria-labelledby="pairTitle">
    <div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="pairTitle">连接你的电脑</h2><button class="icon-button" data-close="pairDialog" aria-label="关闭配对"><svg><use href="#i-close"/></svg></button></header>
    <form id="pairForm" class="pair-form"><p>在电脑观察台生成配对码，<br>把电脑显示的配对码填在这里。</p><label for="pairCode">配对码</label><input id="pairCode" name="code" maxlength="32" minlength="12" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" pattern="[A-Za-z0-9]{4}-?[A-Za-z0-9]{4}-?[A-Za-z0-9]{4}" required><p class="inline-error" id="pairError" role="alert" hidden></p><button class="primary-button" id="pairSubmit">连接并同步对话</button><p class="section-note">还没配对？也可以直接和小伴聊聊。</p></form>
  </dialog>
  <dialog id="voiceDialog" class="sheet compact-sheet" aria-labelledby="voiceOwnerTitle"><div class="sheet-handle" aria-hidden="true"></div><header class="sheet-header"><h2 id="voiceOwnerTitle">在这台设备继续聊？</h2><button class="icon-button" data-close="voiceDialog" aria-label="关闭语音确认"><svg><use href="#i-close"/></svg></button></header><div class="pair-form"><p>另一台设备正在语音对话。接管后，那边的录音和播放会停止。</p><button class="primary-button" id="takeoverVoice">在这里继续语音</button><button class="text-button" data-close="voiceDialog">暂时不用</button></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
